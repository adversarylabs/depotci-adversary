name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Test tagged source
    runs-on: depot-ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  publish:
    name: Bump manifest and publish
    needs: test
    runs-on: depot-ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set version from tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tag must be v followed by a semantic version; got ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

          VERSION="$version" node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";

          const path = "adversary.yaml";
          const source = readFileSync(path, "utf8");
          const matches = source.match(/^version:\s*.*$/gm) ?? [];
          if (matches.length !== 1) {
            throw new Error(`Expected exactly one top-level version field in ${path}`);
          }
          const updated = source.replace(/^version:\s*.*$/m, `version: ${process.env.VERSION}`);
          writeFileSync(path, updated);
          EOF

          npm version "$version" \
            --no-git-tag-version \
            --allow-same-version \
            --ignore-scripts

          name="$(sed -n 's/^name:[[:space:]]*//p' adversary.yaml)"
          if [[ ! "$name" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "adversary.yaml must contain one lowercase OCI-compatible top-level name; got ${name:-<empty>}." >&2
            exit 1
          fi

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit version bump to main
        env:
          RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          auth_header="$(printf 'x-access-token:%s' "$RELEASE_GITHUB_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          credential_key="http.https://github.com/.extraheader"
          cleanup_credentials() {
            git config --local --unset-all "$credential_key" || true
          }
          trap cleanup_credentials EXIT
          git config --local "$credential_key" "AUTHORIZATION: basic $auth_header"

          git fetch --no-tags origin main
          tag_sha="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          main_sha="$(git rev-parse origin/main)"
          message="chore: bump adversary version to ${VERSION} [skip-ci]"
          version_files=(adversary.yaml package.json package-lock.json)

          main_versions_match() {
            metadata_dir="${RUNNER_TEMP:?RUNNER_TEMP is required}/release-main-metadata"
            mkdir -p "$metadata_dir"
            git show origin/main:adversary.yaml >"$metadata_dir/adversary.yaml"
            git show origin/main:package.json >"$metadata_dir/package.json"
            git show origin/main:package-lock.json >"$metadata_dir/package-lock.json"

            METADATA_DIR="$metadata_dir" node --input-type=module <<'EOF'
            import { readFileSync } from "node:fs";

            const directory = process.env.METADATA_DIR;
            const expected = process.env.VERSION;
            const manifest = readFileSync(`${directory}/adversary.yaml`, "utf8");
            const manifestVersions = manifest.match(/^version:\s*(.*)$/gm) ?? [];
            const packageJSON = JSON.parse(readFileSync(`${directory}/package.json`, "utf8"));
            const packageLock = JSON.parse(readFileSync(`${directory}/package-lock.json`, "utf8"));

            const manifestVersion = manifestVersions.length === 1
              ? manifestVersions[0].replace(/^version:\s*/, "")
              : undefined;
            if (
              manifestVersion !== expected ||
              packageJSON.version !== expected ||
              packageLock.version !== expected ||
              packageLock.packages?.[""]?.version !== expected
            ) {
              process.exit(1);
            }
          EOF
          }

          if [[ "$tag_sha" == "$main_sha" ]]; then
            if git diff --quiet -- "${version_files[@]}"; then
              echo "Release metadata is already at ${VERSION}; no bump commit is needed."
            else
              git config user.name "adversarylabs-release"
              git config user.email "adversarylabs-release@users.noreply.github.com"
              git add "${version_files[@]}"
              git commit -m "$message"
              git push origin HEAD:main
            fi
          else
            if ! git merge-base --is-ancestor "$tag_sha" origin/main ||
              ! git log --format=%s "${tag_sha}..origin/main" -- "${version_files[@]}" | grep -Fqx "$message" ||
              ! main_versions_match; then
              echo "Release tag ${GITHUB_REF_NAME} no longer points at main and its version bump is not already present." >&2
              exit 1
            fi
            echo "The ${VERSION} version bump is already on main; continuing this release rerun."
          fi

          cleanup_credentials
          trap - EXIT

      - name: Publish adversary
        uses: adversarylabs/actions/publish@6238ff5df58eeae37cc53b4a7d7da2971953b7c0
        with:
          cli-version: 2026.7.17-beta.5
          path: .
          token: ${{ secrets.ADVERSARY_SERVICE_ACCOUNT_TOKEN }}
          registry-namespace: adversarylabs
          repository-name: ${{ steps.version.outputs.name }}
          publish-latest: true
