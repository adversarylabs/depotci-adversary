name: depot
version: 0.0.4
description: Reviews Depot CI workflows for security, correctness, reliability, caching, and performance concerns.

triggers:
  manual: true
  files_changed:
    - ".depot/workflows/**"
    - ".depot/**/*.yml"
    - ".depot/**/*.yaml"
    - "depot.yml"
    - "depot.yaml"
    - "depot-*.yml"
    - "depot-*.yaml"

runtime:
  name: node
  version: "22"
  command:
    - dist/index.js

permissions:
  enforcement: advisory
  filesystem:
    read:
      - .
    write: []
  network: false
  environment:
    allow: []

findings:
  format: adversary.review.v1
