name: depot
version: 0.1.0
description: Runs Depot CI workflow reviews; detection rules are not implemented yet.

triggers:
  manual: true
  files_changed:
    - ".depot/workflows/**"

runtime:
  name: node
  version: "22"
  command:
    - dist/index.js

permissions:
  enforcement: advisory
  filesystem:
    read:
      - .
    write:
      - .adversary/results
  network: false
  environment:
    allow: []

findings:
  format: adversary.review.v1
