name: Trusted PR target
on:
  pull_request_target:
permissions:
  contents: write
concurrency:
  group: trusted-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: depot-ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out pull request
        uses: actions/checkout@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Execute tests
        run: npm test
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      - name: Save trusted cache
        uses: actions/cache/save@bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        with:
          path: .cache
          key: ${{ runner.os }}-test-${{ hashFiles('package-lock.json') }}
