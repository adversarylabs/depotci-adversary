name: Ungated release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  test:
    runs-on: depot-ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: npm test
  publish:
    runs-on: depot-ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Publish package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
