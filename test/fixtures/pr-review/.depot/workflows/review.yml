name: Adversary review
on:
  pull_request:

jobs:
  review:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    runs-on: depot-ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        with:
          fetch-depth: 0
      - name: Run adversaries
        uses: adversarylabs/actions/run@bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        with:
          auth-mode: oidc
