name: Pull request
on: pull_request
jobs:
  review:
    runs-on: depot-ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Mount public adversary cache
        uses: depot/cache-mount@c4ccf77f90f7fa7df6a002813c0b13f6a5943063 # v1.2.1
        with:
          name: adversary-${{ github.event.repository.id }}-public-v1
          path: /mnt/adversary-public
      - name: Mount private adversary cache
        uses: depot/cache-mount@c4ccf77f90f7fa7df6a002813c0b13f6a5943063 # v1.2.1
        with:
          name: adversary-${{ github.event.repository.id }}-private-v1
          path: /mnt/adversary-private
          debug: false
      - name: Review
        uses: adversarylabs/actions/run@5732ffce7abc90efc8ded4a8f7193dfa6469aa0d # v1.3.2
        with:
          adversaries: ci/depot
          data-dir: /mnt/adversary-public
