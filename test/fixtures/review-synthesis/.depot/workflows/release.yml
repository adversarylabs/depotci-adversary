name: Publish release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: depot-ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run test suite
        run: npm test

  publish:
    needs: validate
    runs-on: depot-ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check version matches tag
        run: ./scripts/check-version "${{ github.ref_name }}"
      - name: Check Node.js version
        run: node --version
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.ELASTICCLAW_TOKEN }}
      - name: Publish release metadata
        uses: elasticclaw/actions/publish@main
        env:
          ELASTICCLAW_TOKEN: ${{ secrets.ELASTICCLAW_TOKEN }}
