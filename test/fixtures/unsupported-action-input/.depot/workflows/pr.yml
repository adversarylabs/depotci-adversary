name: Pull request
on: pull_request
jobs:
  review:
    runs-on: depot-ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Mount adversary cache
        uses: depot/cache-mount@c4ccf77f90f7fa7df6a002813c0b13f6a5943063 # v1.2.1
        with:
          name: adversary-${{ github.event.repository.id }}-public-v1
          path: /mnt/adversary-public
          write-lock: true
      - name: Review
        run: adversary review
